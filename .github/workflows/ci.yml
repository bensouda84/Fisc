name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fisc
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: fisc_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fisc" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://fisc:ci-only-not-a-secret@localhost:5432/fisc_test
      E2E_DATABASE_URL: postgres://fisc:ci-only-not-a-secret@localhost:5432/fisc_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm coverage
      - run: pnpm -F @fisc/web build
      - run: pnpm -F @fisc/web exec playwright install --with-deps chromium
      - run: pnpm -F @fisc/web e2e
        env:
          PW_CHROMIUM: ""
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screens
          path: apps/web/test-results
